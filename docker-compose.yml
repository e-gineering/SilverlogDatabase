services:
  postgres:
    image: postgres:16-alpine
    container_name: silverlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-silverlog}
      POSTGRES_USER: ${POSTGRES_USER:-silverlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-silverlog} -d ${POSTGRES_DB:-silverlog}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
